version: 5.1.0
variant: default
logo: /img/logo.svg
head:
  favicon: /img/favicon.svg
  manifest:
    name: 長生村本郷Engineers'Blog
    short_name: KenzosBlog
    start_url: /
    theme_color: '#3273dc'
    background_color: '#ffffff'
    display: standalone
    icons:
      - src: /img/favicon.svg
        sizes: any
        type: image/svg+xml
  open_graph:
    title:
    type: blog
    url:
    image:
    site_name:
    author:
    description:
    twitter_card:
    twitter_id:
    twitter_site:
    google_plus:
    fb_admins:
    fb_app_id:
  structured_data:
    title:
    description:
    url:
    author:
    publisher:
    publisher_logo:
    image:
  meta:
    - ''
  rss:
navbar:
  # Categories は site.categories から自動生成のドロップダウンで表示するため menu には置かない
  menu:
  links:
    RSS:
      icon: fas fa-rss
      url: /atom.xml
footer:
  links:
    Privacy Policy:
      icon: fab fa-p
      url: /2013/12/31/PrivacyPolicy/
article:
  highlight:
    theme: github-dark
    clipboard: true
    fold: unfolded
  readtime: true
  update_time: true
search:
  type: insight
  index_pages: true
donates:
  - type: patreon
    url: https://www.patreon.com/kenzo0107
share:
  type: addthis
  install_url: '//s7.addthis.com/js/300/addthis_widget.js#pubid=ra-63627f8086ef00a8'
sidebar:
  left:
    sticky: true
  right:
    sticky: true
widgets:
  # - position: right
  #   type: profile
  #   author: kenzo0107
  #   avatar:
  #   avatar_rounded: false
  #   gravatar:
  #   follow_link: 'https://github.com/kenzo0107'
  #   social_links:
  #     Github:
  #       icon: fab fa-github
  #       url: https://github.com/kenzo0107
  #     Twitter:
  #       icon: fab fa-twitter
  #       url: https://twitter.com/kenzo0107
  #     RSS:
  #       icon: fas fa-rss
  #       url: /atom.xml
  - position: left
    type: toc
    index: true
    collapsed: false
    depth: 3
  # - position: right
  #   type: categories
  # - position: right
  #   type: recent_posts
  # - position: right
  #   type: tags
  #   order_by: name
  #   amount:
  #   show_count: true
  # - position: right
  #   type: subscribe_email
  #   description:
  #   feedburner_id: ''
  - position: bottom
    type: adsense
    client_id: 'ca-pub-6265337967545472'
    slot_id: '9975280607'
plugins:
  animejs: true
  back_to_top: true
  baidu_analytics:
    tracking_id:
  busuanzi: false
  cnzz:
    id:
    web_id:
  gallery: true
  google_analytics:
    tracking_id: UA-162026478-1
  hotjar:
    site_id:
  katex: false
  mathjax: false
  outdated_browser: false
  progressbar: true
providers:
  cdn: jsdelivr
  fontcdn: google
  iconcdn: 'https://use.fontawesome.com/releases/v6.7.2/css/all.css'

# Icarus の目次ウィジェット (widgets の type: toc) を有効化するスイッチ
toc: true

# link preview
linkPreview:
  className: link-preview
  descriptionLength: 50
