<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>サッカー スローイン ゲーム 3D</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>⚽ サッカー スローイン ゲーム 3D</h1>
        <div class="info-panel">
            <div class="score">
                <div>飛距離: <span id="distance">0</span>m</div>
                <div>ベスト: <span id="best">0</span>m</div>
            </div>
            <div class="instructions">
                クリックしてパワーを決定！
            </div>
        </div>
        <div id="canvas-container">
            <div id="powerGaugeUI" class="power-gauge-ui">
                <div class="power-label">パワー: <span id="powerValue">0</span>%</div>
                <div class="power-bar-container">
                    <div id="powerBar" class="power-bar"></div>
                </div>
            </div>
        </div>
        <div class="controls">
            <button id="startBtn">スタート</button>
            <button id="resetBtn">リセット</button>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
