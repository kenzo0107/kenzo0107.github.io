<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="戸田市コミュニティバス tocoちゃんバスの時刻表アプリ。次のバスまでのカウントダウン表示。">
  <meta name="keywords" content="戸田公園,コミュニティバス,toco,tocoちゃんバス,戸田市,時刻表">
  <title>tocoちゃんバス 時刻表</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <img src="logo.png" alt="toco ロゴ">
    <h1>tocoちゃんバス</h1>
  </header>

  <main id="main-content">

    <!-- ===== TAB: 時刻表 ===== -->
    <div id="tab-timetable" class="toco-tab active">

      <!-- View: Circuit Selection -->
      <div id="view-circuit">
        <h2>循環を選択してください</h2>
        <div id="circuit-list"></div>
      </div>

      <!-- View: Station Selection -->
      <div id="view-station" style="display:none">
        <button class="btn-back" id="btn-back-station">循環選択に戻る</button>
        <div id="station-title"></div>
        <div id="station-list"></div>
      </div>

      <!-- View: Timetable -->
      <div id="view-timetable" style="display:none">
        <button class="btn-back" id="btn-back-timetable">停留所選択に戻る</button>
        <div id="tt-header">
          <div id="tt-circuit"></div>
          <div id="tt-station"></div>
          <div id="tt-note"></div>
        </div>
        <div id="tt-buses"></div>
        <div class="tt-actions">
          <button class="btn-secondary" id="btn-fav-toggle">☆ お気に入り追加</button>
          <button class="btn-primary" id="btn-refresh">更新</button>
        </div>
      </div>

    </div>

    <!-- ===== TAB: 地図 ===== -->
    <div id="tab-map" class="toco-tab">
      <div id="map-controls">
        <div id="map-circuit-filter">
          <span class="filter-label">路線フィルター：</span>
          <div id="map-circuit-buttons"></div>
        </div>
        <p class="map-note">バスの位置は時刻表をもとにした推定です</p>
      </div>
      <div id="map-container"></div>
    </div>

    <!-- ===== TAB: 近く ===== -->
    <div id="tab-near" class="toco-tab">
      <div id="near-header">
        <h2>近くの停留所</h2>
        <button class="btn-primary" id="btn-locate">現在地を取得</button>
      </div>
      <p id="near-status" class="near-status"></p>
      <div id="near-list"></div>
    </div>

    <!-- ===== TAB: お気に入り ===== -->
    <div id="tab-fav" class="toco-tab">
      <h2>お気に入り</h2>
      <p id="fav-empty" class="empty-msg">お気に入りはまだありません。<br>時刻表画面から追加できます。</p>
      <div id="fav-list"></div>
    </div>

  </main>

  <!-- Bottom Navigation -->
  <nav id="bottom-nav">
    <button class="nav-btn active" data-tab="timetable">
      <span class="nav-icon">🕐</span>
      <span class="nav-label">時刻表</span>
    </button>
    <button class="nav-btn" data-tab="map">
      <span class="nav-icon">🗺️</span>
      <span class="nav-label">地図</span>
    </button>
    <button class="nav-btn" data-tab="near">
      <span class="nav-icon">📍</span>
      <span class="nav-label">近く</span>
    </button>
    <button class="nav-btn" data-tab="fav">
      <span class="nav-icon">⭐</span>
      <span class="nav-label">お気に入り</span>
    </button>
  </nav>

  <footer>
    <p>[戸田市非公式] バス事業者公式アプリではありません。事業者様へのお問い合わせはご遠慮ください。</p>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
