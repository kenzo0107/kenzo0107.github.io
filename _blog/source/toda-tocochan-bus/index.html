<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="戸田市コミュニティバス tocoちゃんバスの循環バス情報。時刻表・地図を確認できます。">
  <meta name="keywords" content="戸田公園,コミュニティバス,toco,tocoちゃんバス,戸田市,時刻表">
  <title>tocoちゃんバス</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <img src="logo.png" alt="tocoちゃんバス">
    <h1>tocoちゃんバス</h1>
    <span class="header-badge">戸田市</span>
  </header>

  <main>
    <p class="section-title">路線を選択</p>
    <div id="circuit-list"></div>
  </main>

  <footer>戸田市コミュニティバス tocoちゃんバス</footer>

  <script src="data.js"></script>
  <script>
    const list = document.getElementById('circuit-list');
    CIRCUITS.forEach((c, idx) => {
      const card = document.createElement('div');
      card.className = 'circuit-card';
      card.style.setProperty('--c-color', c.color);
      card.style.setProperty('--c-bg', c.bg);
      card.style.animationDelay = (idx * 55) + 'ms';

      const dot = document.createElement('div');
      dot.className = 'circuit-dot';
      dot.textContent = '🚌';

      const info = document.createElement('div');
      info.className = 'circuit-info';

      const name = document.createElement('div');
      name.className = 'circuit-name';
      name.textContent = c.name + '循環';

      const note = document.createElement('div');
      note.className = 'circuit-note';
      note.textContent = c.note + ' · ' + c.stations.length + '停留所';

      info.appendChild(name);
      info.appendChild(note);

      const actions = document.createElement('div');
      actions.className = 'circuit-actions';

      const ttLink = document.createElement('button');
      ttLink.className = 'btn-link';
      ttLink.textContent = '🕐 時刻表';
      ttLink.addEventListener('click', (id => () => {
        window.location.href = '/toda-tocochan-bus/timetable/?c=' + id;
      })(c.id));

      const mapLink = document.createElement('button');
      mapLink.className = 'btn-link btn-link-gray';
      mapLink.textContent = '🗺️ マップ';
      mapLink.addEventListener('click', (id => () => {
        window.location.href = '/toda-tocochan-bus/map/?c=' + id;
      })(c.id));

      actions.appendChild(ttLink);
      actions.appendChild(mapLink);

      card.appendChild(dot);
      card.appendChild(info);
      card.appendChild(actions);
      list.appendChild(card);
    });
  </script>
</body>
</html>
