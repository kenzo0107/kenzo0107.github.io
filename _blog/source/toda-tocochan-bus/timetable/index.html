<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>時刻表 — tocoちゃんバス</title>
  <link rel="icon" href="../favicon.ico">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <header class="site-header">
    <img src="../logo.png" alt="tocoちゃんバス">
    <h1>tocoちゃんバス</h1>
    <span class="header-badge">時刻表</span>
  </header>

  <div class="page-header">
    <button class="btn-back" id="btn-back-top">← 路線選択</button>
    <span class="page-title" id="circuit-label"></span>
    <div class="page-actions">
      <button class="btn-link" id="map-link">🗺️ マップ</button>
    </div>
  </div>

  <main>
    <div id="view-stations">
      <div id="station-list"></div>
    </div>

    <div id="view-timetable" style="display:none">
      <button class="btn-back" id="btn-back-tt" style="margin-bottom:16px">← 停留所選択</button>
      <div class="tt-header">
        <div class="tt-label" id="tt-circuit-label"></div>
        <div class="tt-station" id="tt-station-name"></div>
        <div class="tt-note" id="tt-note"></div>
      </div>
      <div id="bus-list"></div>
      <button class="btn-primary" id="btn-refresh">🔄 更新</button>
    </div>
  </main>

  <script src="../data.js"></script>
  <script>
    let countdownTimer = null;
    let currentCircuit = null;
    let currentStation = null;

    function toMinutes(hhmm) {
      const [h, m] = hhmm.split(':').map(Number);
      return h * 60 + m;
    }

    function minutesToHHMM(min) {
      const h = Math.floor(min / 60) % 24;
      const m = min % 60;
      return h + ':' + String(m).padStart(2, '0');
    }

    function getAllBuses(circuit, station) {
      const now = new Date();
      const nowMin = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
      let foundNext = false;
      return circuit.departures.map((dep, i) => {
        const arrMin = toMinutes(dep) + station.offset;
        const date = new Date(now.getFullYear(), now.getMonth(), now.getDate(),
          Math.floor(arrMin / 60), arrMin % 60, 0);
        const isPast = arrMin <= nowMin - 0.5;
        const isNext = !isPast && !foundNext;
        if (isNext) foundNext = true;
        return { index: i + 1, time: minutesToHHMM(arrMin), date, isPast, isNext };
      });
    }

    function formatCountdown(targetDate) {
      const diff = targetDate - Date.now();
      if (diff < 0) return '発車済み';
      const s = Math.floor(diff / 1000);
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = s % 60;
      if (h > 0) return h + '時間 ' + m + '分 ' + sec + '秒';
      if (m > 0) return m + '分 ' + sec + '秒';
      return sec + '秒';
    }

    function getParams() {
      const p = new URLSearchParams(location.search);
      return {
        c: p.has('c') ? Number(p.get('c')) : null,
        s: p.has('s') ? Number(p.get('s')) : null,
      };
    }

    function render() {
      const { c, s } = getParams();
      if (c === null) { window.location.href = '/toda-tocochan-bus/'; return; }
      const circuit = CIRCUITS.find(x => x.id === c);
      if (!circuit) { window.location.href = '/toda-tocochan-bus/'; return; }

      currentCircuit = circuit;
      document.body.style.setProperty('--c-color', circuit.color);
      document.body.style.setProperty('--c-bg', circuit.bg);

      const label = document.getElementById('circuit-label');
      label.textContent = circuit.name + '循環';
      label.style.color = circuit.color;

      if (s !== null) {
        const station = circuit.stations.find(x => x.id === s);
        if (!station) {
          showStationView(circuit);
        } else {
          currentStation = station;
          showTimetableView(circuit, station);
        }
      } else {
        showStationView(circuit);
      }
    }

    function showStationView(circuit) {
      document.getElementById('view-stations').style.display = '';
      document.getElementById('view-timetable').style.display = 'none';
      if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }

      const list = document.getElementById('station-list');
      list.textContent = '';
      circuit.stations.forEach((st, i) => {
        const btn = document.createElement('button');
        btn.className = 'station-item';
        btn.style.animationDelay = Math.min(i * 30, 400) + 'ms';

        const num = document.createElement('span');
        num.className = 'station-num';
        num.textContent = i + 1;

        const nm = document.createElement('span');
        nm.textContent = st.name;

        const arrow = document.createElement('span');
        arrow.textContent = '›';
        arrow.style.cssText = 'margin-left:auto; color:var(--gray-400); font-size:1.2rem; font-weight:700;';

        btn.appendChild(num);
        btn.appendChild(nm);
        btn.appendChild(arrow);
        btn.addEventListener('click', () => selectStation(st));
        list.appendChild(btn);
      });
    }

    function selectStation(station) {
      const { c } = getParams();
      history.pushState({}, '', '?c=' + c + '&s=' + station.id);
      currentStation = station;
      showTimetableView(currentCircuit, station);
    }

    function showTimetableView(circuit, station) {
      document.getElementById('view-stations').style.display = 'none';
      document.getElementById('view-timetable').style.display = '';

      document.getElementById('tt-circuit-label').textContent = circuit.name + '循環';
      document.getElementById('tt-station-name').textContent = station.name;
      document.getElementById('tt-note').textContent = circuit.note;

      renderBuses();
      startCountdown();
    }

    function renderBuses() {
      if (!currentCircuit || !currentStation) return;
      const buses = getAllBuses(currentCircuit, currentStation);
      const container = document.getElementById('bus-list');
      container.textContent = '';

      const allPast = buses.every(b => b.isPast);
      if (allPast) {
        const p = document.createElement('p');
        p.className = 'no-bus';
        p.textContent = '本日のバスは終了しました。';
        container.appendChild(p);
        return;
      }

      const table = document.createElement('table');
      table.className = 'tt-table';

      const thead = document.createElement('thead');
      const hr = document.createElement('tr');
      ['便', '時刻', '残り時間'].forEach(text => {
        const th = document.createElement('th');
        th.textContent = text;
        hr.appendChild(th);
      });
      thead.appendChild(hr);
      table.appendChild(thead);

      const tbody = document.createElement('tbody');
      buses.forEach(bus => {
        const tr = document.createElement('tr');
        tr.className = 'tt-row' +
          (bus.isPast ? ' tt-row--past' : '') +
          (bus.isNext ? ' tt-row--next' : '');

        const numTd = document.createElement('td');
        numTd.className = 'tt-num';
        numTd.textContent = bus.index;

        const timeTd = document.createElement('td');
        timeTd.className = 'tt-time';
        timeTd.textContent = bus.time;

        const statusTd = document.createElement('td');
        statusTd.className = 'tt-status';
        if (bus.isPast) {
          statusTd.textContent = '発車済';
        } else if (bus.isNext) {
          statusTd.dataset.target = bus.date.getTime();
          statusTd.textContent = formatCountdown(bus.date);
        } else {
          statusTd.textContent = '—';
        }

        tr.appendChild(numTd);
        tr.appendChild(timeTd);
        tr.appendChild(statusTd);
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      container.appendChild(table);

      const nextRow = tbody.querySelector('.tt-row--next');
      if (nextRow) {
        setTimeout(() => nextRow.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 80);
      }
    }

    function startCountdown() {
      if (countdownTimer) clearInterval(countdownTimer);
      countdownTimer = setInterval(() => {
        let needsRefresh = false;
        document.querySelectorAll('.tt-status[data-target]').forEach(el => {
          const t = new Date(Number(el.dataset.target));
          const text = formatCountdown(t);
          el.textContent = text;
          if (text === '発車済み') needsRefresh = true;
        });
        if (needsRefresh) renderBuses();
      }, 1000);
    }

    document.getElementById('btn-back-top').addEventListener('click', () => {
      window.location.href = '/toda-tocochan-bus/';
    });

    document.getElementById('map-link').addEventListener('click', () => {
      const { c } = getParams();
      window.location.href = '/toda-tocochan-bus/map/?c=' + c;
    });

    document.getElementById('btn-back-tt').addEventListener('click', () => {
      const { c } = getParams();
      history.pushState({}, '', '?c=' + c);
      showStationView(currentCircuit);
    });

    document.getElementById('btn-refresh').addEventListener('click', renderBuses);

    window.addEventListener('popstate', render);
    render();
  </script>
</body>
</html>
