<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" aria-label="Cloud Logging Bucket vs Cloud Storage">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="hsl(218,70%,42%)"/>
      <stop offset="1" stop-color="hsl(193,64%,34%)"/>
    </linearGradient>
    <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="3" fill="#fff" opacity=".08"/>
    </pattern>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#ffffff" opacity=".85"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity=".18"/>
    </filter>
    <style>
      text{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic','Meiryo',system-ui,sans-serif;}
    </style>
  </defs>

  <rect width="1200" height="500" fill="url(#bg)"/>
  <rect width="1200" height="500" fill="url(#dots)"/>
  <circle cx="1080" cy="80" r="240" fill="none" stroke="#fff" stroke-width="2" opacity=".12"/>
  <circle cx="1080" cy="80" r="150" fill="#fff" opacity=".04"/>

  <!-- header -->
  <text x="70" y="68" font-size="21" font-weight="700" letter-spacing="3" fill="#fff" opacity=".8">KENZO0107.GITHUB.IO</text>
  <text x="70" y="120" font-size="44" font-weight="800" fill="#fff">Logging Bucket vs Cloud Storage</text>

  <!-- arrows (drawn before nodes) -->
  <path d="M222 281 C 340 281, 340 182, 458 182" fill="none" stroke="#fff" stroke-width="3" opacity=".7" marker-end="url(#arrow)"/>
  <path d="M222 281 C 340 281, 340 376, 458 376" fill="none" stroke="#fff" stroke-width="3" opacity=".7" marker-end="url(#arrow)"/>
  <path d="M822 376 L 884 376" fill="none" stroke="#fff" stroke-width="3" opacity=".7" marker-end="url(#arrow)"/>

  <!-- source: audit logs -->
  <g filter="url(#shadow)">
    <rect x="62" y="235" width="160" height="92" rx="16" fill="#ffffff"/>
  </g>
  <rect x="118" y="256" width="34" height="44" rx="4" fill="none" stroke="#1a73e8" stroke-width="3"/>
  <line x1="125" y1="268" x2="145" y2="268" stroke="#1a73e8" stroke-width="3" stroke-linecap="round"/>
  <line x1="125" y1="278" x2="145" y2="278" stroke="#1a73e8" stroke-width="3" stroke-linecap="round"/>
  <line x1="125" y1="288" x2="138" y2="288" stroke="#1a73e8" stroke-width="3" stroke-linecap="round"/>
  <text x="142" y="318" font-size="17" font-weight="700" fill="#202124" text-anchor="middle">Audit Logs</text>

  <!-- top node: Cloud Logging Bucket -->
  <g filter="url(#shadow)">
    <rect x="458" y="130" width="364" height="104" rx="18" fill="#ffffff"/>
  </g>
  <rect x="474" y="150" width="8" height="64" rx="4" fill="#fbbc04"/>
  <circle cx="512" cy="176" r="13" fill="none" stroke="#f9a825" stroke-width="4"/>
  <line x1="521" y1="185" x2="532" y2="196" stroke="#f9a825" stroke-width="4" stroke-linecap="round"/>
  <text x="556" y="172" font-size="26" font-weight="700" fill="#202124">Cloud Logging Bucket</text>
  <text x="556" y="204" font-size="17" fill="#5f6368">Real-time search · Log Analytics</text>

  <!-- bottom node: Cloud Storage -->
  <g filter="url(#shadow)">
    <rect x="458" y="324" width="364" height="104" rx="18" fill="#ffffff"/>
  </g>
  <rect x="474" y="344" width="8" height="64" rx="4" fill="#34a853"/>
  <rect x="500" y="372" width="28" height="22" rx="3" fill="#34a853"/>
  <path d="M506 372 v-6 a8 8 0 0 1 16 0 v6" fill="none" stroke="#34a853" stroke-width="4"/>
  <circle cx="514" cy="382" r="3" fill="#ffffff"/>
  <text x="556" y="366" font-size="26" font-weight="700" fill="#202124">Cloud Storage</text>
  <text x="556" y="398" font-size="17" fill="#5f6368">Long-term · WORM · Archive</text>

  <!-- right node: BigQuery -->
  <g filter="url(#shadow)">
    <rect x="884" y="324" width="256" height="104" rx="18" fill="#ffffff"/>
  </g>
  <rect x="905" y="382" width="9" height="14" rx="2" fill="#4285f4"/>
  <rect x="919" y="372" width="9" height="24" rx="2" fill="#4285f4"/>
  <rect x="933" y="362" width="9" height="34" rx="2" fill="#4285f4"/>
  <text x="958" y="370" font-size="26" font-weight="700" fill="#202124">BigQuery</text>
  <text x="958" y="400" font-size="17" fill="#5f6368">Query on demand</text>
</svg>
