<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>色と数字の切り替え</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 35vw; /* 数字をより大きく */
      color: white;
      font-family: "Helvetica Neue", Arial, sans-serif;
      transition: background-color 0.5s, color 0.5s;
      user-select: none;
    }

    #controls {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.5);
      padding: 10px 12px;
      border-radius: 8px;
      color: white;
      font-size: 16px;
    }

    input {
      width: 50px;
      text-align: center;
    }

    button {
      margin-left: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="controls">
    桁数: <input id="digits" type="number" value="2" min="1" max="2">　
    間隔(秒): <input id="interval" type="number" value="3" min="1">　
    <button id="start">開始</button>
    <button id="stop">停止</button>
  </div>

  <div id="display"></div>

  <script>
    const colors = ["red", "blue", "green", "yellow"];
    let timer = null;

    function randomColor() {
      return colors[Math.floor(Math.random() * colors.length)];
    }

    function randomNumber(digits) {
      const max = digits === 1 ? 9 : 99;
      const min = digits === 1 ? 1 : 10;
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function updateDisplay() {
      const digits = parseInt(document.getElementById('digits').value);
      const color = randomColor();
      const number = randomNumber(digits);

      document.body.style.backgroundColor = color;
      document.body.style.color = (color === "yellow") ? "black" : "white";
      document.getElementById('display').textContent = number;
    }

    document.getElementById('start').addEventListener('click', () => {
      const intervalSec = parseInt(document.getElementById('interval').value);
      if (timer) clearInterval(timer);
      updateDisplay();
      timer = setInterval(updateDisplay, intervalSec * 1000);
    });

    document.getElementById('stop').addEventListener('click', () => {
      if (timer) clearInterval(timer);
    });
  </script>
</body>
</html>
